<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=985">
    <title>Magic Space</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            height: 100vh;
            height: 100dvh;
            background: #1b1734;
            color: #fff;
            overflow: hidden; /* Blocks both vertical and horizontal scrolling */
            position: fixed;
            width: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            display: flex;
            align-items: stretch;
            gap: 24px;
            max-width: 985px;
            width: 985px;
            margin: 0 auto;
        }

        .card {
            background: #252042;
            border-radius: 20px;
            padding: 32px 28px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 26px;
            color: #fff;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #b0aec4;
            margin-bottom: 10px;
        }

        /* Number input field with spinners/arrows removed */
        input[type="number"] {
            width: 100%;
            background: #1b1734;
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 1.05rem;
            color: #fff;
            outline: none;
            transition: all 0.2s ease;
            -webkit-user-select: text;
            user-select: text;
        }

        /* Remove default spinner arrows for Chrome, Safari, Edge, Opera */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        /* Remove default spinner arrows for Firefox */
        input[type=number] {
            -moz-appearance: textfield;
        }

        input[type="number"]::placeholder {
            color: #6b678c;
        }

        input[type="number"]:focus {
            border-color: #00c6ff;
            box-shadow: 0 0 10px rgba(0, 198, 255, 0.2);
        }

        .helper-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #7b7896;
            margin-top: 8px;
        }

        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            flex: 1;
            padding: 12px 8px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.85rem;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-generate {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            box-shadow: 0 4px 15px rgba(56, 239, 125, 0.3);
        }

        .btn-copy {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.3);
        }

        .btn-clear {
            background: linear-gradient(135deg, #654ea3, #eaafc8);
            box-shadow: 0 4px 15px rgba(101, 78, 163, 0.3);
            flex: 0.6;
            color: #fff;
        }

        .badge-box {
            background: rgba(56, 239, 125, 0.08);
            border: 1px solid rgba(56, 239, 125, 0.2);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: #38ef7d;
            margin-top: auto; 
        }

        .preview-box {
            background: #1b1734;
            border: 1.5px dashed rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 16px;
            min-height: 240px;
            max-height: 320px;
            overflow-y: auto;
            font-size: 0.9rem;
            color: #b0aec4;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .preview-footer {
            display: flex;
            justify-content: space-between;
            background: #1b1734;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px 16px;
            border-radius: 12px;
            margin-top: auto;
            font-size: 0.8rem;
            font-weight: 600;
            color: #7b7896;
        }

        .preview-footer span span {
            color: #38ef7d;
        }

        .creator-tag {
            margin-top: 25px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #8f8cb0;
            text-decoration: none;
            transition: color 0.2s ease;
            text-align: center;
        }

        .creator-tag:hover {
            color: #38ef7d;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="card-title">
                ⚡ Magic Space
            </div>

            <div class="form-group">
                <label>Repeat count (1 – 1,00,000)</label>
                <input type="number" id="repeatCount" placeholder="e.g... 500" min="1" max="100000" oninput="updatePreviewInput()">
                <div class="helper-text">
                    <span>Min: 1</span>
                    <span>Max: 100000</span>
                </div>
            </div>

            <div class="btn-container">
                <button class="btn btn-generate" id="genBtn" onclick="generateText()">✨ Generate</button>
                <button class="btn btn-copy" id="copyBtn" onclick="copyText()">📋 Copy</button>
                <button class="btn btn-clear" id="clearBtn" onclick="clearText()">Clear</button>
            </div>

            <div class="badge-box">
                🔥 Dosto ke Sath Prank 🔥
            </div>
        </div>

        <div class="card">
            <div class="card-title">
                👀 Live Preview
            </div>
            
            <div class="preview-box" id="previewContent"></div>

            <div class="preview-footer">
                <span>Characters: <span id="charCount">0</span></span>
                <span>Lines: <span id="lineCount">0</span></span>
            </div>
        </div>
    </div>

    <a href="https://www.instagram.com/herosalman1_929/" target="_blank" class="creator-tag">Made by : @Herosalman1</a>

    <script>
        document.addEventListener('contextmenu', function (e) {
            e.preventDefault();
        });

        document.addEventListener('keydown', function (e) {
            if (
                e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) ||
                (e.ctrlKey && (e.key === 'U' || e.key === 'u'))
            ) {
                e.preventDefault();
                return false;
            }
        });

        document.addEventListener('wheel', function (e) {
            if (e.ctrlKey) {
                e.preventDefault();
            }
        }, { passive: false });

        const invisibleChar = "\u200B"; 

        function updatePreviewInput() {
            let val = document.getElementById('repeatCount').value;
            let count = parseInt(val) || 0;
            
            if (count > 100000) {
                count = 100000;
                document.getElementById('repeatCount').value = 100000;
            }
        }

        function generateText() {
            let val = document.getElementById('repeatCount').value;
            let count = parseInt(val);
            
            if (!count || count < 1) return;
            if (count > 100000) count = 100000;

            document.getElementById('previewContent').innerText = "✨ Magic Space ready ♾️";
            document.getElementById('charCount').innerText = count.toLocaleString();
            document.getElementById('lineCount').innerText = count.toLocaleString();

            let btn = document.getElementById('genBtn');
            btn.innerText = "✅ Done!";
            setTimeout(() => {
                btn.innerText = "✨ Generate";
            }, 1200);
        }

        function copyText() {
            let val = document.getElementById('repeatCount').value;
            let count = parseInt(val);
            
            if (!count || count < 1) return;
            if (count > 100000) count = 100000;

            let textToCopy = "";
            for (let i = 0; i < count; i++) {
                textToCopy += invisibleChar + "\n";
            }
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                let btn = document.getElementById('copyBtn');
                btn.innerText = "📋 Copied!";
                setTimeout(() => {
                    btn.innerText = "📋 Copy";
                }, 1200);
            });
        }

        function clearText() {
            document.getElementById('repeatCount').value = "";
            document.getElementById('previewContent').innerText = "";
            document.getElementById('charCount').innerText = "0";
            document.getElementById('lineCount').innerText = "0";
            
            let btn = document.getElementById('clearBtn');
            btn.innerText = "Cleared⚡";
            setTimeout(() => {
                btn.innerText = "Clear";
            }, 1200);
        }
    </script>
</body>
</html>
